name: Reusable TypeScript quality

on:
  workflow_call:
    inputs:
      node-versions:
        description: JSON array of exact Node.js versions for offline gates
        required: false
        type: string
        default: '["22.22.2", "24.15.0"]'
      pnpm-version:
        description: Exact pnpm version
        required: false
        type: string
        default: 11.13.1
      working-directory:
        description: Repository directory relative to the checkout root
        required: false
        type: string
        default: .

permissions:
  contents: read

jobs:
  offline:
    name: Offline gates (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(inputs.node-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
          version: ${{ inputs.pnpm-version }}
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
          node-version: ${{ matrix.node-version }}
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run offline quality gates
        run: pnpm quality:offline

  dependencies:
    name: Dependency trust gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
          version: ${{ inputs.pnpm-version }}
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
          node-version: 24.15.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit advisories and registry signatures
        run: pnpm deps:check
